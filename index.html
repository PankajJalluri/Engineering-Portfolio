<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pankaj Jalluri's Engineering Portfolio - View projects, experience, and technical expertise in software development and engineering.">
  <meta name="keywords" content="Pankaj Jalluri, engineering portfolio, software development, projects, resume">
  <meta name="author" content="Pankaj Jalluri">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="Pankaj Jalluri - Engineering Portfolio">
  <meta property="og:description" content="Explore my engineering projects and professional experience">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pankajjalluri.github.io/Engineering-Portfolio/">
  
  <title>Pankaj Jalluri - Engineering Portfolio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Akshar', sans-serif;
      line-height: 1.6;
      color: #000;
      background-color: #fff;
      padding: 0;
      min-height: 100vh;
    }
    
    .pdf-container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
    }
    
    embed {
      width: 100%;
      height: 100%;
      background-color: #fff;
    }
    
    .download-link {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 28px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 0;
      transition: all 0.3s ease;
      font-weight: 600;
      font-family: 'Akshar', sans-serif;
      border: 2px solid #000;
      z-index: 100;
      font-size: 0.95rem;
    }
    
    .download-link:hover {
      background-color: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <embed src="assets/portfolio.pdf" type="application/pdf">
  </div>
  
  <a href="assets/portfolio.pdf" download class="download-link">Download PDF</a>
</body>
</html>
