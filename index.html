<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pankaj Jalluri's Engineering Portfolio - View projects, experience, and technical expertise in software development and engineering.">
  <meta name="keywords" content="Pankaj Jalluri, engineering portfolio, software development, projects, resume">
  <meta name="author" content="Pankaj Jalluri">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="Pankaj Jalluri - Engineering Portfolio">
  <meta property="og:description" content="Explore my engineering projects and professional experience">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pankajjalluri.github.io/Engineering-Portfolio/">
  
  <title>Pankaj Jalluri - Engineering Portfolio | Projects & Experience</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #e0e0e0;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      background-attachment: fixed;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: #1e1e2e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d2d3d;
    }
    
    h1 {
      color: #00d4ff;
      margin-bottom: 10px;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    
    .subtitle {
      color: #a0a0b0;
      margin-bottom: 30px;
      font-size: 1.1rem;
      font-weight: 300;
    }
    
    p {
      color: #d0d0d0;
      margin-bottom: 20px;
      line-height: 1.8;
    }
    
    .pdf-container {
      margin: 30px 0;
      border: 2px solid #2d2d3d;
      border-radius: 8px;
      overflow: hidden;
      background-color: #161620;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    
    embed {
      display: block;
      background-color: #0a0a10;
    }
    
    .pdf-info {
      background-color: #252535;
      padding: 15px;
      text-align: center;
      font-size: 0.9rem;
      color: #a0a0b0;
      border-top: 1px solid #2d2d3d;
    }
    
    .download-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }
    
    .download-link:hover {
      background: linear-gradient(135deg, #00e6ff 0%, #00aadd 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
    }
    
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #2d2d3d;
      color: #707080;
      font-size: 0.9rem;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: #0f0f1e;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #00d4ff;
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #00e6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pankaj Jalluri</h1>
    <p class="subtitle">Engineering Portfolio & Project Showcase</p>
    
    <p>Welcome to my professional engineering portfolio. Below you'll find my detailed resume, projects, and technical experience.</p>
    
    <div class="pdf-container">
      <embed src="Pankaj Jalluri Engineering Portfolio.pdf" type="application/pdf" width="100%" height="600px">
      <div class="pdf-info">
        If the PDF doesn't display, <a href="Pankaj Jalluri Engineering Portfolio.pdf" class="download-link">download it here</a>
      </div>
    </div>
    
    <footer>
      <p>&copy; 2026 Pankaj Jalluri. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
